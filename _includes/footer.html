<footer class="footer">
    <div class="container">
        <div class="site-footer__directory">
            {% for column in site.data.footer_directory %}
                <div class="site-footer__column">
                    <p class="site-footer__column-title">{{ column.title }}</p>
                    <ul class="site-footer__links">
                        {% for item in column.links %}
                            <li><a href="{{ item.link | relative_url }}" class="link">{{ item.name }}</a></li>
                        {% endfor %}
                    </ul>
                </div>
            {% endfor %}
        </div>
        <div class="site-footer__bar">
            <p class="site-footer__copy">© {{ site.time | date: '%Y' }} {{ site.title }}</p>
            {% if site.cookie_policy %}
                <a href="{{ site.cookie_policy | relative_url }}" class="link">Política de cookies</a>
            {% endif %}
        </div>
    </div>
</footer>
